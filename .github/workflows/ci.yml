name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  python-contracts:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run mobile contracts
        run: python scripts/mobile_contracts.py

      - name: Run dashboard contracts
        run: python scripts/dashboard_contracts.py

      - name: Run product verification
        run: python scripts/verify_product.py
