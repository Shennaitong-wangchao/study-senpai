name: PR Checks

on:
  pull_request:

jobs:
  # ── 代码质量（比 CI 更严格：ruff 不允许 continue-on-error）─────────────────────
  lint:
    name: Ruff lint (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint with ruff (strict — no continue-on-error)
        run: |
          ruff check src/ tests/ scripts/ --select E,W,F,I --ignore E501,W503

  # ── 测试套件 ──────────────────────────────────────────────────────────────────
  test:
    name: Test suite (3.11 / 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest --tb=short -q

      - name: Run release gate
        run: python scripts/release_gate.py

      - name: Run mobile contracts
        run: python scripts/mobile_contracts.py

      - name: Run dashboard contracts
        run: python scripts/dashboard_contracts.py

  # ── requirements.txt 变更时提示安全审计 ──────────────────────────────────────
  security-audit-reminder:
    name: Security audit reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if requirements.txt changed
        id: req_changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "requirements.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pip-audit
        if: steps.req_changed.outputs.changed == 'true'
        run: python -m pip install pip-audit

      - name: Run pip-audit security scan
        if: steps.req_changed.outputs.changed == 'true'
        run: |
          echo "::notice title=Security Audit::requirements.txt 发生了变更，已自动执行 pip-audit 依赖漏洞扫描。"
          pip-audit -r requirements.txt --format=columns
        continue-on-error: true
