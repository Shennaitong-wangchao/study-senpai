name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── 测试套件 ──────────────────────────────────────────────────────────────────
  test:
    name: Test suite (3.11 / 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python3 -m pytest --tb=short -q

      - name: Run release gate
        run: python3 scripts/release_gate.py

      - name: Run mobile contracts
        run: python3 scripts/mobile_contracts.py

      - name: Run dashboard contracts
        run: python3 scripts/dashboard_contracts.py

  # ── 提取 Release Notes ────────────────────────────────────────────────────────
  extract-notes:
    name: Extract release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_notes: ${{ steps.extract.outputs.release_notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract "## 未发布" section from CHANGELOG.md
        id: extract
        run: |
          python3 - <<'EOF'
          import re, os, sys

          with open("CHANGELOG.md", encoding="utf-8") as f:
              content = f.read()

          # 匹配 "## 未发布" 直到下一个同级标题（## 开头）或文件末尾
          match = re.search(
              r"^## 未发布\s*\n(.*?)(?=^## |\Z)",
              content,
              re.MULTILINE | re.DOTALL,
          )
          if not match:
              print("WARNING: '## 未发布' section not found in CHANGELOG.md", file=sys.stderr)
              notes = "（未在 CHANGELOG.md 中找到 '## 未发布' 部分）"
          else:
              notes = match.group(1).strip()

          # 写入 GitHub output（多行使用 heredoc 语法）
          delimiter = "EOF_RELEASE_NOTES"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"release_notes<<{delimiter}\n{notes}\n{delimiter}\n")
          EOF

  # ── 创建 GitHub Release ───────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, extract-notes]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ needs.extract-notes.outputs.release_notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── 构建并推送 Docker 镜像 ────────────────────────────────────────────────────
  docker-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
