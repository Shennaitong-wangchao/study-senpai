services:
  senpai:
    build: .
    image: study-senpai:latest
    container_name: study-senpai
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - senpai_data:/app/data
      - senpai_logs:/app/logs
    env_file:
      - .env
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8099
      - DASHBOARD_PUBLIC_BIND_ACKNOWLEDGED=true
      - DATABASE_PATH=/app/data/senpai.sqlite3
      - LOG_FILE_PATH=/app/logs/senpai.log
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  senpai_data:
    driver: local
  senpai_logs:
    driver: local
