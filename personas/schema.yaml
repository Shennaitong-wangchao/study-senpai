# Persona YAML Schema 说明文件
# 供社区创建自定义人格参考
#
# 本文件描述所有可用字段及其含义。
# 所有字段均为必填项，缺少任何字段将导致加载失败并给出清晰错误提示。
# YAML 文件须使用 UTF-8 编码，支持中文内容。
#
# 使用方式：
#   1. 复制此文件，按需修改所有字段
#   2. 保存到 personas/ 目录（例如 personas/my_persona.yaml）
#   3. 设置环境变量 PERSONA_FILE=personas/my_persona.yaml 以加载自定义人格
#
# ─────────────────────────────────────────────────────────────
# 字段说明
# ─────────────────────────────────────────────────────────────

# name: str
#   人格的名字。将在所有对话中作为角色名称使用。
name: "人格名字"

# age: int
#   角色年龄（正整数）。
age: 18

# school_role: str
#   角色在学校场景中的身份定位，例如"高三学姐"、"研究生助教"、"大学同学"。
school_role: "角色身份"

# public_title: str
#   对外呈现的标题/定位描述，一句话概括角色的整体风格定位。
public_title: "一句话描述角色定位"

# core_identity: str
#   角色的核心人格描述。可以是多行文本（使用 YAML 的 | 块标量语法）。
#   这是整个人格设计中最重要的字段，决定了 AI 如何理解并扮演这个角色。
core_identity: |
  在这里描述角色的核心身份、性格特点、整体气质。
  支持多行文本。

# outward_presence: str
#   角色面对大多数人时的外在表现（与"对用户的例外"形成对比）。
outward_presence: "描述角色面对普通人时的表现"

# user_exception: str
#   角色对用户（对话对象）的特殊例外处理方式。
#   说明角色会如何对用户表现得更加特别或亲近。
user_exception: "描述角色对用户的特殊态度和行为"

# relationship_position: str
#   角色在关系中所处的位置和承担的功能（例如：陪伴、引导、照顾）。
#   支持多行文本。
relationship_position: |
  描述角色在关系中的位置，以及如何理解和履行这个位置。

# tone: str
#   角色的表达语气和说话风格描述。
#   支持多行文本。
tone: |
  描述语气特征，例如温和、稳重、活泼等。

# emotional_method: str
#   角色处理用户情绪的方法和策略。
#   支持多行文本。
emotional_method: |
  描述角色如何回应和处理用户的情绪状态。

# addressing_policy: str
#   角色对用户的称呼策略（默认称呼、特殊情况下的切换条件）。
#   支持多行文本。
addressing_policy: |
  描述默认称呼规则，以及何时可以使用更亲密的称呼。

# action_policy: str
#   角色使用动作描写（旁白）的规则和边界。
#   支持多行文本。
action_policy: |
  描述角色何时以及如何使用动作旁白，以及格式规范。

# relationship_goal: str
#   角色与用户建立关系的长期目标。
relationship_goal: "一句话描述关系目标"

# memory_goal: str
#   角色如何利用记忆来支撑关系连续性。
memory_goal: "描述记忆在角色扮演中的功能定位"

# language: str
#   角色默认使用的语言设置。
language: "默认使用的语言及切换条件"
