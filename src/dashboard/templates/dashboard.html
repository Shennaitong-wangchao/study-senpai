<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Senpai — Dashboard</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body class="dashboard-page">
  <script id="dashboard-bootstrap" type="application/json">__BOOTSTRAP_JSON__</script>
  <div class="app-shell" id="app-shell">
    <header class="app-header">
      <div class="brand-block">
        <div class="eyebrow">Memory Ops Console</div>
        <h1>沈知微长期陪伴系统</h1>
        <p class="lead">从外观、交互到 observability，一屏追踪当前活跃会话的状态。</p>
      </div>
      <div class="top-actions">
        <div class="inline-group">
          <label class="inline-label" for="global-search-input">全局搜索</label>
          <input id="global-search-input" class="search-input" placeholder="搜记忆 / 任务 / turn / 错误 / request id">
          <button id="global-search-button" class="primary">搜索</button>
        </div>
        <div class="inline-group">
          <label class="inline-label" for="scope-select">当前 Scope</label>
          <select id="scope-select" aria-label="当前 Scope"></select>
          <button id="scope-apply-button" class="ghost" type="button">切换 Scope</button>
        </div>
        <div class="inline-group">
          <label class="inline-label" for="refresh-mode-select">刷新节奏</label>
          <select id="refresh-mode-select" aria-label="刷新节奏"></select>
          <button id="refresh-now-button" class="ghost" type="button">立即刷新</button>
        </div>
        <div class="inline-group">
          <label class="inline-label" for="theme-select">主题</label>
          <select id="theme-select" aria-label="主题">
            <option value="sand">Warm Sand</option>
            <option value="ink">Ink Paper</option>
          </select>
          <label class="inline-label" for="density-select">密度</label>
          <select id="density-select" aria-label="密度">
            <option value="comfortable">舒展</option>
            <option value="compact">紧凑</option>
          </select>
        </div>
        <div class="inline-group">
          <button id="change-password-button" class="ghost" type="button">修改密码</button>
          <button id="logout-button" class="danger" type="button">退出登录</button>
        </div>
      </div>
      <div class="status-bar">
        <div id="scope-summary" class="status-pill"></div>
        <div id="last-refresh-info" class="status-pill">未刷新</div>
        <div id="panel-refresh-info" class="status-pill">当前面板：-</div>
      </div>
      <div id="success-banner" class="banner success hidden" role="status"></div>
      <div id="error-banner" class="banner error hidden" role="alert"></div>
    </header>

    <nav class="tab-nav" aria-label="Dashboard Tabs">
      <button type="button" class="tab-button active" data-tab="overview">总览</button>
      <button type="button" class="tab-button" data-tab="search">全局搜索</button>
      <button type="button" class="tab-button" data-tab="memories">长期记忆</button>
      <button type="button" class="tab-button" data-tab="candidates">候选记忆</button>
      <button type="button" class="tab-button" data-tab="turns">Turn Trace</button>
      <button type="button" class="tab-button" data-tab="attachments">附件工件</button>
      <button type="button" class="tab-button" data-tab="proactive">主动消息</button>
      <button type="button" class="tab-button" data-tab="presence">沉浸状态</button>
      <button type="button" class="tab-button" data-tab="companion-day">她的一天</button>
      <button type="button" class="tab-button" data-tab="shared-diary">共享日记</button>
      <button type="button" class="tab-button" data-tab="reality-context">现实锚点</button>
      <button type="button" class="tab-button" data-tab="facts">Structured Facts</button>
      <button type="button" class="tab-button" data-tab="relationships">Relationship States</button>
      <button type="button" class="tab-button" data-tab="summaries">Summary</button>
      <button type="button" class="tab-button" data-tab="snapshots">快照 Diff</button>
      <button type="button" class="tab-button" data-tab="tasks">后台任务</button>
      <button type="button" class="tab-button" data-tab="errors">错误闭环</button>
      <button type="button" class="tab-button" data-tab="performance">性能成本</button>
      <button type="button" class="tab-button" data-tab="health">健康趋势</button>
      <button type="button" class="tab-button" data-tab="security">安全控制</button>
      <button type="button" class="tab-button" data-tab="audits">审计日志</button>
      <button type="button" class="tab-button" data-tab="logs">运行日志</button>
      <button type="button" class="tab-button" data-tab="webchat">💬 聊天</button>
    </nav>

    <main id="panel-host" class="panel-host"></main>
  </div>

  <dialog id="password-dialog" class="dialog-card">
    <form id="password-form" method="dialog" class="stack-form">
      <h2>修改 Dashboard 密码</h2>
      <label class="field">
        <span>旧密码</span>
        <input id="password-old" type="password" autocomplete="current-password">
      </label>
      <label class="field">
        <span>新密码</span>
        <input id="password-new" type="password" autocomplete="new-password">
      </label>
      <label class="field">
        <span>确认新密码</span>
        <input id="password-confirm" type="password" autocomplete="new-password">
      </label>
      <div class="dialog-actions">
        <button class="ghost" value="cancel" type="button" id="password-cancel">取消</button>
        <button class="primary" type="submit">提交</button>
      </div>
    </form>
  </dialog>

  <script src="/static/dashboard.js"></script>
  <script>
  /* ── Web Chat Panel ───────────────────────────────────────────────────────── */
  (function () {
    'use strict';

    const CHAT_PANEL_HTML = `
      <div id="webchat-panel" class="panel-section" style="max-width:860px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 200px)">
        <div class="panel-header" style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
          <div>
            <h2 class="panel-title">💬 Web 聊天</h2>
            <p class="panel-subtitle" style="margin:0">在浏览器中直接与陪伴 AI 对话，无需 Discord 或 iOS App。</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <button id="chat-load-history-btn" class="ghost" type="button">加载历史</button>
            <button id="chat-clear-btn" class="ghost" type="button">清空</button>
          </div>
        </div>
        <div id="chat-messages" style="flex:1;overflow-y:auto;border:1px solid var(--border,#e5e7eb);border-radius:8px;padding:16px;background:var(--surface,#fff);margin:12px 0;display:flex;flex-direction:column;gap:10px">
          <div id="chat-empty-hint" style="color:var(--text-muted,#9ca3af);font-size:13px;text-align:center;margin:auto">
            点击"加载历史"查看最近对话，或直接发送新消息
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          <textarea id="chat-input" rows="2" placeholder="输入消息，Ctrl+Enter 发送 / Enter 换行…"
            style="flex:1;resize:vertical;padding:10px 14px;border:1px solid var(--border,#e5e7eb);border-radius:8px;font-size:14px;line-height:1.6;font-family:inherit;min-height:56px"></textarea>
          <button id="chat-send-btn" class="primary" style="align-self:flex-end;padding:10px 22px;font-weight:600">发送</button>
        </div>
        <div id="chat-status" style="font-size:12px;color:var(--text-muted,#6b7280);margin-top:4px;min-height:16px"></div>
      </div>`;

    function getCsrfToken() {
      try {
        const b = JSON.parse(document.getElementById('dashboard-bootstrap').textContent);
        return b.csrf_token || '';
      } catch { return ''; }
    }

    function appendMessage(role, text) {
      const el = document.getElementById('chat-messages');
      if (!el) return null;
      const hint = document.getElementById('chat-empty-hint');
      if (hint) hint.remove();
      const isUser = role === 'user';
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;' + (isUser ? 'align-items:flex-end' : 'align-items:flex-start');
      const label = document.createElement('span');
      label.textContent = isUser ? '你' : '学姐';
      label.style.cssText = 'font-size:11px;color:var(--text-muted,#9ca3af);margin-bottom:3px';
      const bubble = document.createElement('div');
      bubble.style.cssText = [
        'max-width:74%;padding:10px 14px;border-radius:14px;line-height:1.65;font-size:14px;white-space:pre-wrap;word-break:break-word',
        isUser
          ? 'background:var(--accent,#6366f1);color:#fff;border-bottom-right-radius:3px'
          : 'background:var(--surface-2,#f3f4f6);color:var(--text,#111827);border-bottom-left-radius:3px',
      ].join(';');
      bubble.textContent = text;
      wrap.appendChild(label);
      wrap.appendChild(bubble);
      el.appendChild(wrap);
      el.scrollTop = el.scrollHeight;
      return bubble;
    }

    function setStatus(msg) {
      const el = document.getElementById('chat-status');
      if (el) el.textContent = msg;
    }

    async function loadHistory() {
      setStatus('加载历史消息…');
      try {
        const resp = await fetch('/mobile/messages?limit=40');
        if (!resp.ok) { setStatus('加载失败: ' + resp.status); return; }
        const data = await resp.json();
        const el = document.getElementById('chat-messages');
        if (!el) return;
        el.innerHTML = '';
        const msgs = (data.items || []).slice().reverse();
        if (msgs.length === 0) {
          el.innerHTML = '<div style="color:var(--text-muted,#9ca3af);font-size:13px;text-align:center;margin:auto">暂无历史消息</div>';
        } else {
          msgs.forEach(m => appendMessage(m.sender_type === 'user' ? 'user' : 'assistant', m.content));
        }
        setStatus('已加载 ' + msgs.length + ' 条历史消息');
        setTimeout(() => setStatus(''), 2500);
      } catch (e) {
        setStatus('加载失败: ' + e.message);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const btn = document.getElementById('chat-send-btn');
      const content = (input.value || '').trim();
      if (!content) return;

      appendMessage('user', content);
      input.value = '';
      btn.disabled = true;
      setStatus('AI 正在回复…');

      const assistantBubble = appendMessage('assistant', '▌');

      try {
        const resp = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': getCsrfToken() },
          body: JSON.stringify({ content, display_name: '用户' }),
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: resp.statusText }));
          if (assistantBubble) assistantBubble.textContent = '错误: ' + (err.detail || resp.statusText);
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let lineBuffer = '';
        let buffer = '';
        if (assistantBubble) assistantBubble.textContent = '▌';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          lineBuffer += decoder.decode(value, { stream: true });
          const lines = lineBuffer.split('\n');
          lineBuffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data:')) continue;
            try {
              const ev = JSON.parse(line.slice(5).trim());
              if (ev.type === 'token' || ev.type === 'delta') {
                buffer += (ev.text || ev.delta || '');
                if (assistantBubble) {
                  assistantBubble.textContent = buffer + '▌';
                  const msgEl = document.getElementById('chat-messages');
                  if (msgEl) msgEl.scrollTop = msgEl.scrollHeight;
                }
              } else if (ev.type === 'error') {
                if (assistantBubble) assistantBubble.textContent = '错误: ' + ev.text;
              }
            } catch { /* 忽略非 JSON 行 */ }
          }
        }
        if (assistantBubble) assistantBubble.textContent = buffer || '（无回复）';
      } catch (e) {
        if (assistantBubble) assistantBubble.textContent = '请求失败: ' + e.message;
      } finally {
        btn.disabled = false;
        setStatus('');
      }
    }

    function initChatPanel() {
      const tabBtn = document.querySelector('[data-tab="webchat"]');
      const host = document.getElementById('panel-host');
      if (!tabBtn || !host) return;

      tabBtn.addEventListener('click', () => {
        if (document.getElementById('webchat-panel')) return;
        host.innerHTML = CHAT_PANEL_HTML;
        document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
        document.getElementById('chat-clear-btn').addEventListener('click', () => {
          const el = document.getElementById('chat-messages');
          if (el) el.innerHTML = '<div style="color:var(--text-muted,#9ca3af);font-size:13px;text-align:center;margin:auto">面板已清空，历史消息仍保存在服务端</div>';
        });
        document.getElementById('chat-load-history-btn').addEventListener('click', loadHistory);
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); sendMessage(); }
        });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initChatPanel);
    } else {
      initChatPanel();
    }
  })();
  </script>
</body>
</html>
